        "waybill":          { "mirror": true },
        "moldloft":         { "mirror": true },
        "shakedown":        { "mirror": true },
        "chartroom":        { "mirror": true },
        "tidegauge":        { "mirror": true },
        "bellbuoy":         { "mirror": true }
      },
      "workers": {
        "conn":        "clearedstack.com",
        "muster":      "muster",
        "logbook":     "logbook",
        "plainforge":  "plainforge",
        "lazarette":   "lazarette",
        "keelworks":   "keelworks",
        "shipkeeper":  "shipkeeper",
        "trawl":       "trawl",
        "sextant":     "sextant",
        "assay":       "assay",
        "countersign": "countersign",
        "waybill":     "waybill",
        "moldloft":    "moldloft",
        "shakedown":   "shakedown",
