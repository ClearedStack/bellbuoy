# Bellbuoy in the cs-workers namespace.
#
# No secret is stored in this repository. The ServiceAccount token Kubernetes
# mounts proves Bellbuoy's identity to Muster. If owner alerts are enabled,
# create or seal the optional Secret bellbuoy-webhook (key: url) in cs-workers.
#
# Before applying to the cluster, replace the placeholder sha256 digest on the
# Deployment image with the digest Keelworks/ko pushed to Lazarette:
#   KO_DOCKER_REPO=lazarette.clearedstack.svc.cluster.local:5000 \
#     ko build --base-import-paths --platform=linux/arm64 ./cmd/bellbuoy
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bellbuoy
  namespace: cs-workers
  labels:
    app.kubernetes.io/name: bellbuoy
    app.kubernetes.io/part-of: clearedstack
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bellbuoy-config
  namespace: cs-workers
  labels:
    app.kubernetes.io/name: bellbuoy
    app.kubernetes.io/part-of: clearedstack
